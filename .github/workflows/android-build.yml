# force redo
name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Buildozer Docker image
        run: |
          docker run --rm \ -v ${{ github.workspace }}:/home/user/app \ -w /home/user/app
            ghcr.io/kivy/buildozer:latest \
            buildozer -v android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app
          path: bin/*.apk
